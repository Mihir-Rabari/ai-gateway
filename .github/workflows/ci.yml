name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.21.0'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # quality: lint, type-check, build, test (Turborepo)
  # ─────────────────────────────────────────────────────────────────────
  quality:
    name: Lint · Type-check · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Turborepo uses git history for affected/change detection

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm turbo run type-check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test || pnpm dlx tsx --test apps/worker/src/__tests__/handlers.test.ts apps/credit-service/src/__tests__/creditService.test.ts apps/routing-service/src/__tests__/RoutingService.test.ts apps/routing-service/src/__tests__/validateModelConfig.test.ts apps/gateway/src/__tests__/GatewayService.test.ts apps/gateway/src/__tests__/gatewayRoutes.integration.test.ts apps/utils/src/__tests__/*.test.ts packages/sdk-js/src/*.test.ts apps/analytics-service/src/__tests__/usageBatch.test.ts

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────
  # docker: Build image + push to GHCR (main branch pushes only)
  # ─────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push (GHCR)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=AI Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
